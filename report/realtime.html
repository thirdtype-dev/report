<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>실시간 급등</title>
    <style>
      :root {
        color-scheme: dark;
        --line: rgba(148, 163, 184, 0.18);
        --muted: #aab8cc;
        --text: #eef5ff;
        --soft: #d7e4f7;
        --panel: rgba(15, 24, 39, 0.92);
        --panel-2: rgba(20, 33, 52, 0.9);
        --accent: #49d19a;
        --accent-2: #7dd3fc;
        --warn: #f8d477;
      }
      body {
        margin: 0;
        font-family: "Pretendard", "SUIT", "Apple SD Gothic Neo", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% -10%, rgba(73, 209, 154, 0.22), transparent 34rem),
          radial-gradient(circle at 92% 2%, rgba(125, 211, 252, 0.18), transparent 30rem),
          linear-gradient(145deg, #08101d 0%, #101827 44%, #172035 100%);
        min-height: 100vh;
      }
      .page {
        width: min(920px, 100%);
        margin: 0 auto;
        padding: 18px;
        box-sizing: border-box;
      }
      .room-header {
        position: sticky;
        top: 0;
        z-index: 10;
        margin: -18px -18px 18px;
        padding: 16px 18px 14px;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(9, 17, 31, 0.96), rgba(9, 17, 31, 0.82)),
          rgba(9, 17, 31, 0.9);
        backdrop-filter: blur(18px);
      }
      .room-title {
        margin: 0 0 8px;
        color: #ffffff;
        font-size: clamp(1.7rem, 6vw, 2.5rem);
        font-weight: 900;
        letter-spacing: -0.06em;
      }
      .room-crumb {
        margin: 0 0 14px;
        color: #9bdcff;
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .room-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(8, 16, 29, 0.68);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .room-tab {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 12px;
        color: var(--muted);
        background: transparent;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 900;
        letter-spacing: -0.03em;
        cursor: pointer;
      }
      .room-tab.is-active {
        color: #06111e;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 10px 26px rgba(73, 209, 154, 0.22);
      }
      .report {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 22px;
        background: var(--panel);
      }
      .report::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 5px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--warn));
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .eyebrow.published {
        background: rgba(73, 209, 154, 0.16);
        color: #a7f3d0;
        border: 1px solid rgba(73, 209, 154, 0.24);
      }
      .kicker {
        color: #bae6fd;
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .report h1 {
        margin: 8px 0 14px;
        font-size: clamp(1.55rem, 5vw, 2.25rem);
        letter-spacing: -0.05em;
      }
      .live-board {
        margin-top: 16px;
      }
      .live-board[hidden] { display: none; }
      .signal-list {
        display: grid;
        gap: 14px;
      }
      .signal-card {
        padding: 20px 22px 16px;
        border: 1px solid rgba(190, 210, 255, 0.34);
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(245, 249, 255, 0.96));
        box-shadow:
          0 18px 32px rgba(4, 12, 24, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.65);
      }
      .signal-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .signal-head-main {
        flex: 1;
        min-width: 0;
      }
      .signal-topline {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .signal-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 0.79rem;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .signal-badge.is-up {
        color: #ffffff;
        background: linear-gradient(135deg, #16a34a, #22c55e);
      }
      .signal-badge.is-down {
        color: #ffffff;
        background: linear-gradient(135deg, #dc2626, #fb7185);
      }
      .signal-badge.is-neutral {
        color: #ffffff;
        background: linear-gradient(135deg, #f59e0b, #fbbf24);
      }
      .signal-name-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .signal-name {
        margin: 0;
        color: #111827;
        font-size: 1.85rem;
        font-weight: 800;
        letter-spacing: -0.05em;
      }
      .signal-code {
        color: #94a3b8;
        font-size: 1rem;
        font-weight: 600;
      }
      .signal-headline {
        margin: 0;
        color: #1f2937;
        font-size: 1.1rem;
        font-weight: 800;
        line-height: 1.45;
        letter-spacing: -0.03em;
      }
      .signal-summary {
        margin: 8px 0 0;
        color: #64748b;
        font-size: 0.96rem;
        line-height: 1.55;
      }
      .signal-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 900;
      }
      .signal-pill.is-up {
        color: #166534;
        background: rgba(34, 197, 94, 0.12);
      }
      .signal-pill.is-down {
        color: #be123c;
        background: rgba(244, 63, 94, 0.12);
      }
      .signal-pill.is-neutral {
        color: #b45309;
        background: rgba(245, 158, 11, 0.14);
      }
      .signal-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
        margin-top: 14px;
      }
      .signal-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .signal-link {
        color: #4f46e5;
        font-size: 0.84rem;
        font-weight: 700;
        text-decoration: none;
      }
      .signal-link:hover {
        text-decoration: underline;
      }
      .disclaimer {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.82rem;
      }
      @media (max-width: 640px) {
        .page { padding: 10px; }
        .room-header { margin: -10px -10px 14px; padding: 14px 10px 12px; }
        .room-tab { padding: 9px 10px; font-size: 0.9rem; }
        .report { border-radius: 22px; padding: 18px 14px; }
        .signal-card { padding: 18px 16px 14px; }
        .signal-name { font-size: 1.55rem; }
        .signal-head { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="room-header">
        <h1 class="room-title">리딩방</h1>
        <div class="room-tabs" role="tablist" aria-label="리딩방 상단 탭">
          <button type="button" class="room-tab" data-room-link="./index.html" aria-selected="false">브리핑</button>
          <button type="button" class="room-tab is-active" aria-selected="true">실시간 급등</button>
        </div>
      </section>
      <article class="report">
        <div class="eyebrow published">실시간 급등</div>
        <h1 id="realtime-title">실시간 슬롯 데이터 불러오는 중</h1>
        <section class="live-board" id="live-board" hidden>
          <div class="signal-list" id="signal-list"></div>
        </section>
      </article>
      <section class="disclaimer">본 서비스의 투자 정보는 단순 참고용이며, 종목 추천이나 투자 권유가 아닙니다. 브리핑에서 열리는 별도 페이지이므로 상단 버튼으로만 이동합니다.</section>
    </main>
    <script>
      const realtimeTitle = document.getElementById('realtime-title');
      const liveBoard = document.getElementById('live-board');
      const signalList = document.getElementById('signal-list');
      const dataBaseCandidates = window.location.pathname.includes('/report/')
        ? ['./report/data', './data']
        : ['./report/data', './data'];

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatBadge(signal) {
        if (signal.direction === 'up') return { className: 'is-up', label: '긍정' };
        if (signal.direction === 'down') return { className: 'is-down', label: '우려' };
        return { className: 'is-neutral', label: '중립' };
      }

      function formatRealtimeTitle(slot) {
        const date = String(slot.generatedDate || '').trim();
        const slotLabel = String(slot.slot || '').trim();
        if (date && slotLabel) return `${date} ${slotLabel} 기준`;
        return slot.title || '실시간 급등';
      }

      function buildRelatedLinks(signal) {
        const relatedPosts = Array.isArray(signal.relatedPosts) ? signal.relatedPosts : [];
        const links = relatedPosts.filter((item) => item?.url).slice(0, 3);
        if (!links.length && signal.sourceUrl) {
          return [{
            label: '관련기사1',
            url: signal.sourceUrl
          }];
        }
        return links.map((item, index) => ({
          label: item.label || `관련기사${index + 1}`,
          url: item.url
        }));
      }

      function buildSupportingText(signal) {
        const summary = String(signal.summary || '').trim();
        if (summary && !/공개 채널 멘션|market research/i.test(summary)) return summary;
        const relatedPosts = Array.isArray(signal.relatedPosts) ? signal.relatedPosts : [];
        const secondary = relatedPosts.find((item) => item?.title && item.title !== signal.headline);
        if (secondary?.title) return secondary.title;
        return summary || '관련 포스트를 통해 추가 근거를 확인할 수 있습니다.';
      }

      function renderSignalCard(signal) {
        const badge = formatBadge(signal);
        const relatedLinks = buildRelatedLinks(signal);
        const supportingText = buildSupportingText(signal);
        const stockCode = signal.stockCode ? `${signal.stockCode}` : '';
        return `
          <article class="signal-card">
            <div class="signal-head">
              <div class="signal-head-main">
                <div class="signal-topline">
                  <span class="signal-badge ${badge.className}">${escapeHtml(badge.label)}</span>
                  <div class="signal-name-row">
                    <h3 class="signal-name">${escapeHtml(signal.stockName)}</h3>
                    ${stockCode ? `<span class="signal-code">${escapeHtml(stockCode)}</span>` : ''}
                  </div>
                </div>
                <p class="signal-headline">${escapeHtml(signal.headline || signal.latestHeadline || signal.summary)}</p>
                <p class="signal-summary">${escapeHtml(supportingText)}</p>
              </div>
              <div class="signal-pill ${badge.className}">${escapeHtml(badge.label)}</div>
            </div>
            <div class="signal-footer">
              <div class="signal-links">
                ${relatedLinks.map((item) => `<a class="signal-link" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${escapeHtml(item.label)}</a>`).join('')}
              </div>
            </div>
          </article>
        `;
      }

      async function resolveDataBase() {
        for (const candidate of dataBaseCandidates) {
          try {
            const slotRes = await fetch(`${candidate}/slot-adapter.json`, { cache: 'no-store' });
            if (slotRes.ok) return candidate;
          } catch (error) {
            // Try the next known publication path.
          }
        }
        throw new Error('data_base_not_found');
      }

      async function loadRealtimeSurge() {
        try {
          const dataBase = await resolveDataBase();
          const [slotRes, realtimeRes] = await Promise.all([
            fetch(`${dataBase}/slot-adapter.json`, { cache: 'no-store' }),
            fetch(`${dataBase}/realtime-surge.json`, { cache: 'no-store' })
          ]);

          if (!slotRes.ok || !realtimeRes.ok) throw new Error('fetch_failed');

          const slot = await slotRes.json();
          const realtime = await realtimeRes.json();
          const signals = Array.isArray(realtime.signals) ? realtime.signals : [];
          realtimeTitle.textContent = formatRealtimeTitle(slot);

          if (!signals.length) {
            realtimeTitle.textContent = formatRealtimeTitle(slot);
            signalList.innerHTML = '';
            liveBoard.hidden = false;
            return;
          }

          signalList.innerHTML = signals.slice(0, 20).map(renderSignalCard).join('');
          liveBoard.hidden = false;
        } catch (error) {
          realtimeTitle.textContent = '실시간 급등';
          signalList.innerHTML = '';
          liveBoard.hidden = false;
        }
      }

      document.querySelectorAll('[data-room-link]').forEach((tab) => {
        tab.addEventListener('click', () => {
          const href = tab.getAttribute('data-room-link');
          if (href) window.location.href = href;
        });
      });

      loadRealtimeSurge();
    </script>
  </body>
</html>
