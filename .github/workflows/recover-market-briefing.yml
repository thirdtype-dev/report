name: Recover Market Briefing

on:
  schedule:
    - cron: '50 23 * * 0-4'
    - cron: '20 7 * * 1-5'
  workflow_dispatch:
    inputs:
      trading_date:
        description: 'Recovery target KST date (YYYY-MM-DD)'
        required: false
        type: string
      phase:
        description: Recovery target phase
        required: false
        default: pre_market
        type: choice
        options:
          - pre_market
          - post_market

permissions:
  actions: write
  contents: read

concurrency:
  group: market-briefing-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Freeze and validate recovery slot
        id: slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_TRADING_DATE: ${{ inputs.trading_date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/briefing-slot.mjs >> "$GITHUB_OUTPUT"

      - name: Evaluate KRX trading day
        id: trading_day
        run: node scripts/briefing-trading-day.mjs >> "$GITHUB_OUTPUT"

      - name: Skip on KRX holiday
        if: steps.trading_day.outputs.is_trading_day != 'true'
        run: |
          echo "Skipping recovery check."
          echo "KST date: ${{ steps.trading_day.outputs.trading_date }}"
          echo "Reason: ${{ steps.trading_day.outputs.skip_reason }}"

      # GitHub cron is best effort. A successful run means public verification,
      # never merely acceptance of a workflow dispatch request.
      - name: Recover and observe public publication
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/recover-market-briefing.mjs
