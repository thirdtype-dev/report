name: Publish Realtime Surge

on:
  workflow_dispatch:
    inputs:
      slot_hour:
        description: KST realtime slot hour
        required: true
        default: '10'
        type: choice
        options:
          - '9'
          - '930'
          - '10'
          - '1030'
          - '11'
          - '1130'
          - '12'
          - '1230'
          - '13'
          - '1330'
          - '14'
          - '1430'
          - '15'
      description_only:
        description: Refresh existing card descriptions without changing the card list
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: realtime-surge-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh KIND listed stocks master
        run: python3 scripts/fetch_kind_listed_stocks.py

      - name: Generate realtime surge data
        env:
          REALTIME_SLOT_HOUR: ${{ inputs.slot_hour }}
          ANALYST_PROVIDER: openrouter
          ANALYST_MODEL: openrouter/free
          ANALYST_FALLBACK_PROVIDER: openrouter
          ANALYST_FALLBACK_MODEL: deepseek/deepseek-v4-flash
          LLM_TIMEOUT_MS: '45000'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REALTIME_DESCRIPTION_ONLY: ${{ inputs.description_only == 'true' && '1' || '0' }}
        run: node scripts/generate-realtime-surge.mjs

      - name: Publish generated realtime data
        run: |
          mkdir -p report/data
          cp public/report/data/slot-adapter.json report/data/slot-adapter.json
          cp public/report/data/realtime-surge.json report/data/realtime-surge.json

      - name: Commit and push
        run: |
          temp_dir="$(mktemp -d)"
          cp report/data/slot-adapter.json "$temp_dir/slot-adapter.json"
          cp report/data/realtime-surge.json "$temp_dir/realtime-surge.json"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p report/data
          cp "$temp_dir/slot-adapter.json" report/data/slot-adapter.json
          cp "$temp_dir/realtime-surge.json" report/data/realtime-surge.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/data/slot-adapter.json report/data/realtime-surge.json
          if git diff --cached --quiet; then
            echo "Latest realtime surge payload already matches remote main."
            exit 0
          fi
          git commit -m "Publish realtime surge slot"
          git push origin main
