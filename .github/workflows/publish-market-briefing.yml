name: Publish Market Briefing
run-name: "briefing:${{ inputs.trading_date || 'auto' }}:${{ inputs.phase || 'pre_market' }}"

on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: 'Frozen target KST trading date (YYYY-MM-DD); omitted for same-day legacy callers'
        required: false
        type: string
      as_of:
        description: 'Optional post-market backfill cutoff within 48 hours (YYYY-MM-DDT16:00:00+09:00)'
        required: false
        type: string
      phase:
        description: Briefing phase
        required: false
        default: pre_market
        type: choice
        options:
          - pre_market
          - post_market

permissions:
  contents: write
  actions: read

concurrency:
  group: report-publish
  cancel-in-progress: false

jobs:
  publish:
    env:
      BRIEFING_AS_OF: ${{ inputs.as_of }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Freeze and validate requested slot
        id: slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PHASE: ${{ inputs.phase || 'pre_market' }}
          INPUT_TRADING_DATE: ${{ inputs.trading_date }}
        run: node scripts/briefing-slot.mjs >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install primary authenticated KRX collector
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          if [ -n "$KRX_ID" ] && [ -n "$KRX_PW" ]; then
            python -m pip install --upgrade pykrx==1.2.8
          else
            echo "KRX credentials unavailable; NAVER Finance/KRX fallback will be used."
          fi

      - name: Evaluate KRX trading day
        id: trading_day
        run: node scripts/briefing-trading-day.mjs >> "$GITHUB_OUTPUT"

      - name: Skip on KRX holiday
        if: steps.trading_day.outputs.is_trading_day != 'true'
        run: |
          echo "Skipping market briefing publish."
          echo "KST date: ${{ steps.trading_day.outputs.trading_date }}"
          echo "Reason: ${{ steps.trading_day.outputs.skip_reason }}"

      # The global report-publish lock is already held. Read current main,
      # not the dispatch-time checkout, to suppress duplicate generation.
      - name: Check committed slot inside publication lock
        id: committed
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          REPORT_INDEX_PATH: /tmp/current-briefing.html
        run: |
          git fetch origin main
          git show origin/main:report/index.html > "$REPORT_INDEX_PATH"
          node scripts/check-briefing-recovery.mjs >> "$GITHUB_OUTPUT"

      - name: Revalidate date immediately before generation
        if: steps.trading_day.outputs.is_trading_day == 'true' && steps.committed.outputs.should_recover == 'true'
        env:
          INPUT_PHASE: ${{ steps.slot.outputs.phase }}
          INPUT_TRADING_DATE: ${{ steps.slot.outputs.trading_date }}
        run: node scripts/briefing-slot.mjs

      - name: Generate briefing
        if: steps.trading_day.outputs.is_trading_day == 'true' && steps.committed.outputs.should_recover == 'true'
        env:
          BRIEFING_PHASE: ${{ inputs.phase || 'pre_market' }}
          ANALYST_PROVIDER: openrouter
          ANALYST_MODEL: deepseek/deepseek-v4-flash
          LLM_TIMEOUT_MS: '90000'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: node scripts/generate-market-briefing.mjs

      - name: Publish generated HTML
        if: steps.trading_day.outputs.is_trading_day == 'true' && steps.committed.outputs.should_recover == 'true'
        run: |
          cp public/report/index.html index.html
          mkdir -p report
          cp public/report/index.html report/index.html
          mkdir -p report/data
          cp public/report/data/market-research.json report/data/market-research.json
          cp public/report/data/report.json report/data/report.json

      - name: Validate generated briefing
        if: steps.trading_day.outputs.is_trading_day == 'true' && steps.committed.outputs.should_recover == 'true'
        env:
          BRIEFING_PHASE: ${{ inputs.phase || 'pre_market' }}
        run: node scripts/check-briefing-recovery.mjs --require-valid

      - name: Revalidate date before committing
        if: steps.trading_day.outputs.is_trading_day == 'true' && steps.committed.outputs.should_recover == 'true'
        env:
          INPUT_PHASE: ${{ steps.slot.outputs.phase }}
          INPUT_TRADING_DATE: ${{ steps.slot.outputs.trading_date }}
        run: node scripts/briefing-slot.mjs

      - name: Commit and push
        if: steps.trading_day.outputs.is_trading_day == 'true' && steps.committed.outputs.should_recover == 'true'
        env:
          PUBLISH_COMMIT_MESSAGE: Publish market briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-generated-report.mjs index.html report/index.html report/data/market-research.json report/data/report.json

      - name: Verify actual public publication
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: node scripts/verify-public-briefing.mjs
