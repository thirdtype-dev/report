name: Publish Market Briefing

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Briefing phase
        required: false
        default: pre_market
        type: choice
        options:
          - pre_market
          - post_market

permissions:
  contents: write

concurrency:
  group: report-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install primary authenticated KRX collector
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          if [ -n "$KRX_ID" ] && [ -n "$KRX_PW" ]; then
            python -m pip install --upgrade pykrx==1.2.8
          else
            echo "KRX credentials unavailable; NAVER Finance/KRX fallback will be used."
          fi

      - name: Evaluate KRX trading day
        id: trading_day
        run: node scripts/krx-business-day.mjs >> "$GITHUB_OUTPUT"

      - name: Skip on KRX holiday
        if: steps.trading_day.outputs.is_trading_day != 'true'
        run: |
          echo "Skipping market briefing publish."
          echo "KST date: ${{ steps.trading_day.outputs.trading_date }}"
          echo "Reason: ${{ steps.trading_day.outputs.skip_reason }}"

      - name: Generate briefing
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          BRIEFING_PHASE: ${{ inputs.phase || 'pre_market' }}
          ANALYST_PROVIDER: openrouter
          ANALYST_MODEL: deepseek/deepseek-v4-flash
          LLM_TIMEOUT_MS: '90000'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: node scripts/generate-market-briefing.mjs

      - name: Publish generated HTML
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          cp public/report/index.html index.html
          mkdir -p report
          cp public/report/index.html report/index.html
          mkdir -p report/data
          cp public/report/data/market-research.json report/data/market-research.json
          cp public/report/data/report.json report/data/report.json

      - name: Validate generated briefing
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          BRIEFING_PHASE: ${{ inputs.phase || 'pre_market' }}
        run: node scripts/check-briefing-recovery.mjs --require-valid

      - name: Commit and push
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          PUBLISH_COMMIT_MESSAGE: Publish market briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-generated-report.mjs index.html report/index.html report/data/market-research.json report/data/report.json
