name: Publish Market Briefing

on:
  schedule:
    - cron: '20 23 * * 0-4'
    - cron: '25 23 * * 0-4'
    - cron: '30 23 * * 0-4'
    - cron: '50 6 * * 1-5'
    - cron: '55 6 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: Briefing phase
        required: false
        default: pre_market
        type: choice
        options:
          - pre_market
          - post_market

permissions:
  contents: write

concurrency:
  group: market-briefing-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install market data dependencies
        run: python -m pip install --upgrade pykrx==1.2.8

      - name: Evaluate KRX trading day
        id: trading_day
        run: node scripts/krx-business-day.mjs >> "$GITHUB_OUTPUT"

      - name: Skip on KRX holiday
        if: steps.trading_day.outputs.is_trading_day != 'true'
        run: |
          echo "Skipping market briefing publish."
          echo "KST date: ${{ steps.trading_day.outputs.trading_date }}"
          echo "Reason: ${{ steps.trading_day.outputs.skip_reason }}"

      - name: Generate briefing
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          BRIEFING_PHASE: ${{ inputs.phase || ((github.event.schedule == '50 6 * * 1-5' || github.event.schedule == '55 6 * * 1-5' || github.event.schedule == '0 7 * * 1-5') && 'post_market' || 'pre_market') }}
          ANALYST_PROVIDER: openrouter
          ANALYST_MODEL: openrouter/free
          ANALYST_FALLBACK_PROVIDER: gemini
          ANALYST_FALLBACK_MODEL: gemini-2.5-flash
          LLM_TIMEOUT_MS: '45000'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: node scripts/generate-market-briefing.mjs

      - name: Publish generated HTML
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          cp public/report/index.html index.html
          mkdir -p report
          cp public/report/index.html report/index.html
          mkdir -p report/data
          cp public/report/data/market-research.json report/data/market-research.json
          cp public/report/data/report.json report/data/report.json

      - name: Commit and push
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          temp_dir="$(mktemp -d)"
          cp index.html "$temp_dir/index.html"
          cp report/index.html "$temp_dir/report-index.html"
          cp report/data/market-research.json "$temp_dir/market-research.json"
          cp report/data/report.json "$temp_dir/report.json"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p report/data
          cp "$temp_dir/index.html" index.html
          cp "$temp_dir/report-index.html" report/index.html
          cp "$temp_dir/market-research.json" report/data/market-research.json
          cp "$temp_dir/report.json" report/data/report.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html report/index.html report/data/market-research.json report/data/report.json
          if git diff --cached --quiet; then
            echo "Latest published briefing already matches remote main."
            exit 0
          fi
          git commit -m "Publish market briefing"
          git push origin main
