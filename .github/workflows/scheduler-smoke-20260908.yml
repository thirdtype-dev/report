name: Verify scheduler with existing published slot
on:
  push:
    paths: ['.github/workflows/scheduler-smoke-20260908.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exercise duplicate-slot skip and public verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/actions/workflows/publish-market-briefing.yml/dispatches" \
            -f ref=main -f inputs[phase]=post_market -f inputs[trading_date]=2026-09-07 \
            -f inputs[as_of]=2026-09-07T16:00:00+09:00
